<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-sm p-6 bg-white rounded shadow">
      <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
      <form>
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Email</label>
          <input type="email" placeholder="Enter your email" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Password</label>
          <input type="password" placeholder="Enter your password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Login</button>
      </form>
      <p class="text-center mt-4 text-gray-600">
        Don't have an account? <a [routerLink]="['/signup']" class="text-blue-500 hover:underline">Sign up</a>
      </p>
    </div>
  </div>
