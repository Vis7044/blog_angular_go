<form 
  #exampleForm="ngForm" 
  (ngSubmit)="onSubmit(exampleForm)" 
  class="flex flex-col gap-4 bg-white w-[20rem]"
>
  <!-- Email Field -->
  <div class="flex flex-col gap-1">
    <label for="email" class="text-gray-700 font-medium">Email</label>
    <input 
      pInputText 
      type="email" 
      id="email" 
      name="email" 
      placeholder="Enter your email" 
      [(ngModel)]="user.email" 
      #email="ngModel" 
      required 
      email 
      class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all"
      [ngClass]="{'border-red-400': email.invalid && (email.touched || exampleForm.submitted)}"
      [style]="{ background: 'white', color: 'black', width: '20rem' }"
    />
    <p-message *ngIf="email.invalid && (email.touched || exampleForm.submitted)" severity="error" size="small" variant="simple">
      <span *ngIf="email.hasError('required')">Email is required.</span>
      <span *ngIf="email.hasError('email')">Please enter a valid email.</span>
    </p-message>
  </div>

  <!-- Password Field -->
  <div class="flex flex-col gap-1">
    <label for="password" class="text-gray-700 font-medium">Password</label>
    <input 
      pInputText 
      type="password" 
      id="password" 
      name="password" 
      placeholder="Enter your password" 
      [(ngModel)]="user.password" 
      #password="ngModel" 
      required 
      minlength="6"
      class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all"
      [ngClass]="{'border-red-400': password.invalid && (password.touched || exampleForm.submitted)}"
      [style]="{ background: 'white', color: 'black', width: '20rem' }"
    />
    <p-message *ngIf="password.invalid && (password.touched || exampleForm.submitted)" severity="error" size="small" variant="simple">
      <span *ngIf="password.hasError('required')">Password is required.</span>
      <span *ngIf="password.hasError('minlength')">Password must be at least 6 characters.</span>
    </p-message>
  </div>

  <!-- Submit Button -->
  <div class="flex justify-end">
    <button 
      pButton 
      type="submit" 
      label="Login"
      [disabled]="exampleForm.invalid"
      [style]="{background: exampleForm.valid ? '#3b82f6' : '#d1d5db', color: 'white', width: 'auto', border: 'black'}"
      class="mb-4 text-white font-semibold py-2 px-4 rounded-lg transition-colors cursor-pointer"
      [ngClass]="{
        'bg-blue-500 hover:bg-blue-600 cursor-pointer': exampleForm.valid,
        'bg-gray-300 cursor-not-allowed': exampleForm.invalid
      }"
    ></button>
  </div>
</form>
