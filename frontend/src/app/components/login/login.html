<form 
  #exampleForm="ngForm" 
  (ngSubmit)="onSubmit(exampleForm)" 
  class="flex flex-col gap-4 bg-white w-[20rem]"
>
  <!-- Username Field -->
  <div class="flex flex-col gap-1">
    <label for="username" class="text-gray-700 font-medium">Username</label>
    <input 
      pInputText 
      type="text" 
      id="username" 
      name="username" 
      placeholder="Enter your username" 
      [(ngModel)]="user.username" 
      #username="ngModel" 
      required 
      class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all"
      [ngClass]="{'border-red-400': username.invalid && (username.touched || exampleForm.submitted)}"
      [style]="{ background: 'white', color: 'black', width: '20rem' }"
    />
    @if (username.invalid && (username.touched || exampleForm.submitted)) {
      <p-message severity="error" size="small" variant="simple">
        Username is required.
      </p-message>
    }
  </div>

  <!-- Email Field -->
  <div class="flex flex-col gap-1">
    <label for="email" class="text-gray-700 font-medium">Email</label>
    <input 
      pInputText 
      type="email" 
      id="email" 
      name="email" 
      placeholder="Enter your email" 
      [(ngModel)]="user.email" 
      #email="ngModel" 
      required 
      email 
      class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all"
      [ngClass]="{'border-red-400': email.invalid && (email.touched || exampleForm.submitted)}"
      [style]="{ background: 'white', color: 'black', width: '20rem' }"
    />
    @if (email.invalid && (email.touched || exampleForm.submitted)) {
      <p-message severity="error" size="small" variant="simple">
        @if (email.hasError('required')) {
          Email is required.
        }
        @if (email.hasError('email')) {
          Please enter a valid email.
        }
      </p-message>
    }
  </div>

  <!-- Submit Button (Aligned Right, Hover Only When Valid) -->
  <div class="flex justify-end">
    <button 
      pButton 
      type="submit" 
      label="Login"
      severity="primary"
      [disabled]="exampleForm.invalid"
      [style]="{background: exampleForm.valid ? '#3b82f6' : '#d1d5db', color: 'white', width: 'auto', border: 'black'}"
      class="mb-4 text-white font-semibold py-2 px-4 rounded-lg transition-colors cursor-pointer"
      [ngClass]="{
        'bg-blue-500 hover:bg-blue-600 cursor-pointer': exampleForm.valid,
        'bg-gray-300 cursor-not-allowed': exampleForm.invalid
      }"
    ></button>
  </div>

</form>
